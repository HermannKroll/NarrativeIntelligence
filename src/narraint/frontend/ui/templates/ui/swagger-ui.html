{% load static %}

<!DOCTYPE html>
<html>
  <head>
    <title>Swagger</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="{% static 'css/libraries/swagger-ui.3.52.5.min.css' %}" rel="stylesheet"/>
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="{% static 'js/libraries/swagger-ui-bundle.3.52.5.min.js' %}"></script>
    <script>
    const ui = SwaggerUIBundle({
        url: "{% static 'api_description.yaml' %}",
        dom_id: '#swagger-ui',
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIBundle.SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout",
        requestInterceptor: (request) => {
          request.headers['X-CSRFToken'] = "{{ csrf_token }}"
          return request;
        }
      })
    </script>
  </body>
</html>
